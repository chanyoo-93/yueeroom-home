name: CD — Frontend

on:
  push:
    branches: [main, staging]

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build → S3 Upload → CloudFront Invalidation (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js (static export)
        run: pnpm --filter @yueeroom/frontend build
        env:
          NEXT_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-Frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload static assets to S3 (long-lived cache)
        if: github.ref_name == 'main'
        run: |
          aws s3 sync apps/frontend/out/_next/static/ \
            s3://${{ secrets.FRONTEND_S3_BUCKET }}/_next/static/ \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

      - name: Upload HTML and other files to S3 (no-cache)
        if: github.ref_name == 'main'
        run: |
          aws s3 sync apps/frontend/out/ \
            s3://${{ secrets.FRONTEND_S3_BUCKET }}/ \
            --cache-control "public,no-cache,must-revalidate" \
            --exclude "_next/static/*" \
            --delete

      - name: Invalidate CloudFront cache
        if: github.ref_name == 'main'
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"
          echo "CloudFront invalidation completed"

      - name: Smoke test (staging only)
        if: github.ref_name == 'staging'
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "Skipping smoke test: DOMAIN secret not configured"
            exit 0
          fi
          FRONTEND_URL="https://$DOMAIN"
          echo "Running smoke tests against $FRONTEND_URL"

          for path in "/" "/login" "/register"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$FRONTEND_URL$path" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "PASS $path → $STATUS"
            else
              echo "FAIL $path → $STATUS (expected 200)"
              exit 1
            fi
          done

          echo "All smoke tests passed"
