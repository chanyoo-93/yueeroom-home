services:
  postgres:
    image: postgres:16-alpine
    container_name: yueeroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yueeroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yueeroom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-yueeroom_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yueeroom}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yueeroom-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-yueeroom_redis_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '--no-auth-warning',
          '-a',
          '${REDIS_PASSWORD:-yueeroom_redis_password}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
